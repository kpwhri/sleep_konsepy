[project]
name = "sleep_konsepy"
version = "0.1.0"
description = "Konsepy NLP for extracting sleep scores (mostly AHI)."
requires-python = ">=3.11"
dependencies = [
    "konsepy>=0.6.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = 'src'

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
